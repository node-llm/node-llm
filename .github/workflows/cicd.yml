name: CI/CD

on:
  push:
    branches: ["**"] # Run on all branches
    paths:
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/cicd.yml"
      - "README.md"
      - "docs/**"
      - "scripts/generate-llms-full*.mjs"
  pull_request:
    branches: ["main"]
    paths:
      - "packages/**"
      - "examples/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/cicd.yml"
      - "README.md"
      - "docs/**"
      - "scripts/generate-llms-full*.mjs"
  workflow_call:

# Read-only by default: the test job runs code from pull requests. Only the publish job, which
# runs on main, can write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x", "22.x"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install
        env:
          DATABASE_URL: "postgresql://localhost:5432/dummy"

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://localhost:5432/dummy"

      - name: Lint
        run: pnpm run lint || echo "Linting failed but continuing tests"

      - name: Check docs/llms-full.txt is up to date
        run: pnpm run docs:llms:check

      - name: Run tests
        run: pnpm -r test
        env:
          # VCR mode - use recorded cassettes
          VCR_MODE: replay

      - name: Verify documentation examples (Core)
        run: |
          cd packages/core
          npm run test:docs

      - name: Verify documentation examples (ORM)
        run: |
          cd packages/orm
          npm run test:docs

      - name: Verify documentation examples (Testing)
        run: |
          cd packages/testing
          npm run test:docs

  publish:
    name: Build + Publish
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for creating releases
      packages: write # Needed for publishing to GitHub Packages
    strategy:
      fail-fast: false
      matrix:
        package-path: ["packages/core", "packages/orm", "packages/testing", "packages/mcp"]

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup pnpm
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
          registry-url: "https://registry.npmjs.org"

      - name: Install dependencies
        run: pnpm install
        env:
          DATABASE_URL: "postgresql://localhost:5432/dummy"

      - name: Build
        run: pnpm run build
        env:
          DATABASE_URL: "postgresql://localhost:5432/dummy"

      - name: Get Package Info
        id: pkg
        run: |
          cd ${{ matrix.package-path }}
          VERSION=$(node -p "require('./package.json').version")
          NAME=$(node -p "require('./package.json').name")
          DIR_NAME=$(basename ${{ matrix.package-path }})
          echo "version=$VERSION" >> $GITHUB_OUTPUT
          echo "name=$NAME" >> $GITHUB_OUTPUT
          echo "dir=$DIR_NAME" >> $GITHUB_OUTPUT

      - name: Check if version needs publishing
        id: check_version
        run: |
          PACKAGE_VERSION="${{ steps.pkg.outputs.version }}"
          PACKAGE_NAME="${{ steps.pkg.outputs.name }}"

          echo "Checking if $PACKAGE_NAME@$PACKAGE_VERSION is already published..."

          # Check if version exists on npm
          if npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null; then
            echo "Version $PACKAGE_VERSION already published"
            echo "version_changed=false" >> $GITHUB_OUTPUT
          else
            echo "Version $PACKAGE_VERSION not published yet"
            echo "version_changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Publish to npm
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          cd ${{ matrix.package-path }}
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Setup Node.js for GitHub Packages
        if: steps.check_version.outputs.version_changed == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22.x"
          registry-url: "https://npm.pkg.github.com"

      - name: Publish to GitHub Packages
        if: steps.check_version.outputs.version_changed == 'true'
        run: |
          cd ${{ matrix.package-path }}
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create GitHub Release
        if: steps.check_version.outputs.version_changed == 'true'
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ steps.pkg.outputs.dir }}-v${{ steps.pkg.outputs.version }}
          name: ${{ steps.pkg.outputs.dir }} v${{ steps.pkg.outputs.version }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
